<!DOCTYPE html>
<html>
<head>
  <title>Bookmark Manager Options</title>
  <link rel="stylesheet" type="text/css" href="options.css">
</head>
<body>
  <div class="container">
    <h1>Settings</h1>

    <div class="section">
      <h2>Add New Bookmark</h2>
      <form id="add-bookmark-form">
        <input type="text" id="bookmark-title" placeholder="Title" required>
        <input type="url" id="bookmark-url" placeholder="URL" required>
        <select id="bookmark-category-select"></select>
        <button type="submit">Add Bookmark</button>
      </form>
    </div>

    <div class="section">
      <h2>Manage Bookmarks</h2>
      <div id="bookmarks-management-list"></div>
    </div>

    <div class="section">
      <h2>Add New Category</h2>
      <form id="add-category-form">
        <input type="text" id="category-name" placeholder="Category Name" required>
        <button type="submit">Add Category</button>
      </form>
    </div>

    <div class="section">
      <h2>Manage Categories</h2>
      <div id="categories-management-list"></div>
    </div>

    <div class="section">
      <h2>Import Bookmarks</h2>
      <p>Import all your existing bookmarks from your Bookmarks Bar into the dashboard.</p>
      <button id="import-bookmarks-btn">Import Now</button>
    </div>

     <div class="section">
        <h2>Color Settings</h2>
        <form id="color-settings-form">
            <div class="color-picker-group">
              <label for="font-color-picker">Main Font:</label>
              <input type="color" id="font-color-picker" value="#f8f8f2">
              <input type="number" id="font-size-picker" min="8" max="32" value="16">
              <span>px</span>
            </div>
            <div class="color-picker-group">
              <label for="section-title-color-picker">Section Titles:</label>
              <input type="color" id="section-title-color-picker" value="#50fa7b">
              <input type="number" id="section-title-size-picker" min="8" max="32" value="16">
               <span>px</span>
            </div>
            <div class="color-picker-group">
              <label for="category-title-color-picker">Category Titles:</label>
              <input type="color" id="category-title-color-picker" value="#bd93f9">
              <input type="number" id="category-title-size-picker" min="8" max="32" value="16">
               <span>px</span>
            </div>
            <div class="form-actions">
              <button type="submit">Save Styles</button>
              <button type="button" id="reset-styles-btn">Reset to Defaults</button>
            </div>
        </form>
    </div>

    <div class="section danger-zone">
      <h2>Danger Zone</h2>
      <p>These actions are irreversible. Please be certain.</p>
      <div class="danger-actions">
        <button id="clear-bookmarks-btn" class="danger-btn">Clear Dashboard Bookmarks</button>
        <button id="reset-all-btn" class="danger-btn">Reset All Settings</button>
      </div>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
