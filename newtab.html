<!DOCTYPE html>
<html>
<head>
  <title>New Tab</title>
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
  <div class="container">
    <div class="search-container">
      <form id="search-form">
        <select id="search-engine">
          <option value="https://www.google.com/search?q=">Google</option>
          <option value="https://www.bing.com/search?q=">Bing</option>
          <option value="https://duckduckgo.com/?q=">DuckDuckGo</option>
          <option value="https://yandex.com/search/?text=">Yandex</option>
        </select>
        <input type="text" id="search-input" placeholder="Search..." autofocus>
      </form>
    </div>
    <div id="pinned-bookmarks" class="bookmarks-section">
      <h2>Pinned</h2>
      <div id="pinned-bookmarks-list" class="bookmarks-grid"></div>
    </div>
    <div id="bookmarks" class="bookmarks-section">
      <h2>Bookmarks</h2>
      <div id="bookmarks-container" class="bookmarks-container"></div>
    </div>
  </div>
  <div id="tooltip" class="tooltip" style="display:none;"></div>
  <div class="footer-links">
    <a id="settings-link" href="options.html" target="_blank" title="Settings">
      <img src="icon.png" alt="Settings" id="settings-icon">
    </a>
     <a id="manager-link" href="manager.html" target="_blank" title="Manager">
      <span>&#9776;</span>
    </a>
  </div>
  <script src="script.js"></script>
</body>
</html>
